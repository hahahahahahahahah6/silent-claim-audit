[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silent-claim-audit"
version = "0.1.0"
description = "Offline auditing of documented terminal-output claims against Python source."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
silent-claim-audit = "silent_claim_audit.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
